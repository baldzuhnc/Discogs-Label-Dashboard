[project]
name = "powerdigger"
version = "2.0.0"
description = "Find the needles in a record label's haystack - Discogs digging assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
powerdigger = "powerdigger.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["powerdigger*"]

[tool.setuptools.package-data]
powerdigger = ["static/*"]
